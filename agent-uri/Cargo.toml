[package]
name = "agent-uri"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Parser and validator for agent:// URI scheme"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agent-uri"
readme = "README.md"
keywords = ["agent", "uri", "multi-agent", "identity", "a2a"]
categories = ["parsing", "web-programming"]
# The fuzz targets build only under `cargo fuzz`, which supplies its own
# toolchain and flags; they have no place in the published crate.
exclude = ["fuzz"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = []
serde = ["dep:serde"]
kani = []

# docs.rs builds with default features unless told otherwise, and these
# crates default to none, so the serde impls would be missing from the
# rendered docs.
[package.metadata.docs.rs]
# `kani` is left off: it gates proof harnesses for the model checker, not
# API a reader of the docs can call.
features = ["serde"]

[dependencies]
mti = "1.1.1"
uuid = "1.19.0"
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.9.0"
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parsing"
harness = false
