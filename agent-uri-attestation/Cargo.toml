[package]
name = "agent-uri-attestation"
version = "0.8.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PASETO v4.public attestation for agent-uri"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agent-uri-attestation"
readme = "README.md"
keywords = ["agent", "uri", "paseto", "attestation", "ed25519"]
categories = ["authentication", "cryptography"]
# The fuzz targets build only under `cargo fuzz`, which supplies its own
# toolchain and flags; they have no place in the published crate.
exclude = ["fuzz"]

[features]
default = []
# Draw randomness from the JavaScript host on wasm32-unknown-unknown. That
# target has no operating system to ask, so the three crates below refuse to
# compile there until a binary says where randomness comes from. A browser or
# Node.js build enables this feature; a build for another wasm32 host leaves it
# off and chooses its own source, as `getrandom` asks of libraries. On every
# other target the feature changes nothing.
js = [
    "dep:getrandom",
    "getrandom/js",
    "dep:ring",
    "ring/wasm32_unknown_unknown_js",
    "dep:uuid",
    "uuid/js",
]

[dependencies]
agent-uri = { version = "0.6", path = "../agent-uri", features = ["serde"] }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "batteries_included"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# Pinned to 0.8, and not upgradable independently. `SigningKey::generate` hands
# the RNG to ed25519-dalek 2.x, which takes a `rand_core` 0.6 `CryptoRng`; rand
# 0.9 implements `rand_core` 0.9, whose traits are a different, incompatible
# set. Moving to rand 0.9 therefore requires ed25519-dalek 3.x, not a bump here.
# This is a constraint of the dependency graph, not an un-tended version.
rand = "0.8"
base64 = "0.22"
zeroize = "1.9.0"
typeid_suffix = "1.3.0"

[dev-dependencies]
# `kani-verifier` is deliberately absent. The proof harnesses in `src/proofs.rs`
# are gated on `#[cfg(kani)]`, which only `cargo kani` sets, and that tool
# supplies the `kani` crate itself. Depending on it here bought nothing and cost
# every contributor the download. `agent-uri` carries the same harnesses with no
# such dependency; see `task kani`.
proptest = "1.5"
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# Only the `js` feature enables these, and only on wasm32-unknown-unknown, where
# minting and verifying draw no randomness but generating a key does
# (`ed25519-dalek` through `rand_core` 0.6 and `getrandom` 0.2), and so do
# generating a `jti` (`uuid`) and `rusty_paseto`'s random keys (`ring`).
#
# `uuid` asks for 1.19, the version the lockfile holds, so adding it here does
# not move the lockfile to a `uuid` built on `getrandom` 0.4, a third version
# that `deny.toml` would have to excuse.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", optional = true }
ring = { version = "0.17.14", optional = true }
uuid = { version = "1.19", optional = true }
