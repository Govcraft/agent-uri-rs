[package]
name = "agent-uri-dht"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Capability-based DHT discovery for agent:// URI scheme"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/agent-uri-dht"
readme = "README.md"
keywords = ["agent", "dht", "discovery", "kademlia", "capability"]
categories = ["network-programming", "data-structures"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = []
serde = ["dep:serde", "agent-uri/serde"]

# docs.rs builds with default features unless told otherwise, and these
# crates default to none, so the serde impls would be missing from the
# rendered docs.
[package.metadata.docs.rs]
features = ["serde"]

[dependencies]
agent-uri = { version = "0.6", path = "../agent-uri" }
agent-uri-attestation = { version = "0.8", path = "../agent-uri-attestation" }
async-trait = "0.1.91"
sha2 = "0.10"

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dev-dependencies]
criterion = "0.8.1"
futures = "0.3.33"
serde_json = "1.0.151"

[[bench]]
name = "dht_bench"
harness = false
