[package]
name = "agent-uri-dht"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Capability-based DHT discovery for agent:// URI scheme"
keywords = ["agent", "dht", "discovery", "kademlia", "capability"]
categories = ["network-programming", "data-structures"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = []
serde = ["dep:serde", "agent-uri/serde"]

[dependencies]
agent-uri = { version = "0.5", path = "../agent-uri" }
agent-uri-attestation = { version = "0.5", path = "../agent-uri-attestation" }
async-trait = "0.1.91"
sha2 = "0.10"

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dev-dependencies]
criterion = "0.8.1"
futures = "0.3.33"

[[bench]]
name = "dht_bench"
harness = false
