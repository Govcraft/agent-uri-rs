name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-check so newly published advisories surface without a push.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# One lane per event type. Grouping on the ref alone put a scheduled run and a
# push to main in the same lane, so an ordinary merge cancelled whatever
# verification was in flight — silently, because a cancelled run is not a red X
# anyone chases. The long jobs below are exactly the ones that were exposed.
#
# Cancelling superseded runs of the *same* event is still what you want: push
# again to a pull request and the previous run for that branch goes away.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: fmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      # The fuzz targets are detached workspaces, so --all does not reach them.
      - name: Check fuzz target formatting
        run: |
          cargo fmt --manifest-path agent-uri/fuzz/Cargo.toml -- --check
          cargo fmt --manifest-path agent-uri-attestation/fuzz/Cargo.toml -- --check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: --workspace --all-targets
          - name: all-features
            args: --workspace --all-targets --all-features
          - name: agent-uri-serde
            args: -p agent-uri --all-targets --features serde
          - name: agent-uri-kani
            args: -p agent-uri --all-targets --features kani
          - name: agent-uri-dht-serde
            args: -p agent-uri-dht --all-targets --features serde
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}
      - name: Clippy (${{ matrix.name }})
        run: cargo clippy ${{ matrix.args }} -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --workspace --all-features
      # Nextest does not execute doctests.
      - name: Run doctests
        run: cargo test --doc --workspace --all-features
      # The fuzz targets call the same API as the tests. They are built for real
      # only on the schedule, so without this an API change would break them
      # silently for a week.
      - name: Check fuzz targets compile
        run: |
          cargo clippy --manifest-path agent-uri/fuzz/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path agent-uri-attestation/fuzz/Cargo.toml --all-targets -- -D warnings
      # The attestation harness carries its own tests: a verifier that accepted
      # nothing would let a fuzz run report success having exercised only the
      # refusal path.
      - name: Test the fuzz harness
        run: cargo test --manifest-path agent-uri-attestation/fuzz/Cargo.toml --lib

  # A declared MSRV that nothing checks is a claim, not a guarantee: the next
  # dependency bump or the next `if let ... &&` raises it silently and the first
  # anyone hears is a consumer's build failing. This job pins the exact version
  # `workspace.package.rust-version` names.
  #
  # It builds rather than tests: the MSRV is a promise about compiling this
  # workspace's code, and dev-dependencies (nextest, criterion, the libp2p test
  # harnesses) carry their own, higher floors that have nothing to do with what
  # a consumer needs.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The manifest is repository content, and on a fork's pull request that
      # is the contributor's content. It is matched against a version shape
      # before it reaches $GITHUB_OUTPUT, so a crafted manifest cannot smuggle a
      # newline and define outputs of its own.
      - name: Read MSRV from the workspace manifest
        id: msrv
        run: |
          version=$(
            grep -m1 -oE '^rust-version = "[0-9]+(\.[0-9]+){1,2}"' Cargo.toml \
              | grep -oE '[0-9]+(\.[0-9]+){1,2}'
          )
          if [ -z "$version" ]; then
            echo "workspace.package.rust-version is missing or not a version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      - name: Build on the declared MSRV
        run: cargo build --workspace --all-features

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      # Advisories, licenses, duplicate versions, and crate sources.
      # Policy and its documented exceptions live in deny.toml.
      - name: cargo-deny
        run: cargo deny check
      # Second opinion from the RustSec advisory database; its exception list
      # lives in .cargo/audit.toml and mirrors deny.toml.
      - name: cargo-audit
        run: cargo audit

  # Kani proves properties over every input in a bounded range, which is the
  # thing a test suite cannot do: `matching_issuers_succeed` is a statement
  # about all issuers, not the dozen a test happened to name. The harnesses
  # (agent-uri/src/kani_impls.rs, agent-uri-attestation/src/proofs.rs) have
  # existed all along with nothing running them.
  #
  # Weekly and on demand, not per-PR: a model checker exhausts a state space,
  # and that takes minutes per harness.
  kani:
    name: kani
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Pinned so a run is reproducible and a Kani release cannot turn a green
      # week red on its own. Bump deliberately.
      KANI_VERSION: 0.67.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: kani
      # `cargo kani setup` downloads a toolchain and a solver into ~/.kani.
      # Swatinem's cache does not reach outside the cargo directories, so this
      # is cached separately, keyed on the version that produced it.
      - name: Cache the Kani toolchain
        uses: actions/cache@v4
        with:
          path: ~/.kani
          key: kani-toolchain-${{ env.KANI_VERSION }}
      - name: Install Kani
        run: |
          cargo install --locked "kani-verifier@${KANI_VERSION}"
          cargo kani setup
      # Only the two crates that carry harnesses. `--workspace` would put the
      # model checker to work compiling the CLI, the evaluation harness, and
      # libp2p to prove nothing.
      - name: Run the proofs
        run: cargo kani -p agent-uri -p agent-uri-attestation

  # Miri interprets the code and reports undefined behaviour: an out-of-bounds
  # read, a dangling reference, a violated aliasing rule. This workspace is
  # entirely safe Rust, so what it really watches is the unsafe inside the
  # dependencies these crates lean on for base32, base64, and Ed25519.
  #
  # Scoped to the two crates whose tests are pure computation. agent-uri-dht,
  # -dht-libp2p, and the CLI test against tokio, real sockets, and the
  # filesystem, none of which Miri can execute; pointing it at them would
  # produce a job that fails every week for reasons that are not defects.
  miri:
    name: miri
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # The attestation tests read the clock, which Miri's isolation refuses.
      # Disabling it lets `Utc::now()` through; it does not weaken any of the
      # undefined-behaviour checks, which are what this job is for.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: Set up Miri
        run: cargo miri setup
      # `--lib` deliberately: the integration suites spend their time on
      # end-to-end paths that the unit tests already cover in the interpreter,
      # and Miri is roughly two orders of magnitude slower than native.
      - name: Run tests under Miri
        run: cargo miri test -p agent-uri -p agent-uri-attestation --lib

  # Code that reads untrusted input and panics is a denial of service in every
  # service that runs it: a parser for the URI, and the verifier for a token
  # handed over by whoever is presenting it. The proptests in the test job cover
  # this on every commit; this job spends real time on it. It runs on the weekly
  # schedule and on demand rather than per-PR, because a fuzzing run long enough
  # to be worth anything is longer than a PR should wait for.
  fuzz:
    name: fuzz (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: agent-uri
            target: parse_uri
          - crate: agent-uri
            target: parse_trust_root
          - crate: agent-uri
            target: parse_query
          - crate: agent-uri
            target: parse_fragment
          - crate: agent-uri
            target: parse_agent_id
          - crate: agent-uri-attestation
            target: verify_token
          - crate: agent-uri-attestation
            target: verify_signed_claims
          - crate: agent-uri-attestation
            target: parse_key_document
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # cargo-fuzz needs nightly for the sanitizer and coverage flags it passes.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: ${{ matrix.crate }}/fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz
      # Seeds start the run from inputs that already reach past the scheme, so
      # the budget is spent on the parser rather than on rediscovering
      # "agent://". libFuzzer writes what it finds to the *first* corpus
      # directory, so the working corpus is named first and the checked-in seeds
      # second, where they are read and never written.
      - name: Fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.crate }}
        run: |
          cargo fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=300 -rss_limit_mb=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: ${{ matrix.crate }}/fuzz/artifacts
