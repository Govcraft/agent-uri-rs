name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-check so newly published advisories surface without a push.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: fmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      # The fuzz targets are a detached workspace, so --all does not reach them.
      - name: Check fuzz target formatting
        run: cargo fmt --manifest-path agent-uri/fuzz/Cargo.toml -- --check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: --workspace --all-targets
          - name: all-features
            args: --workspace --all-targets --all-features
          - name: agent-uri-serde
            args: -p agent-uri --all-targets --features serde
          - name: agent-uri-kani
            args: -p agent-uri --all-targets --features kani
          - name: agent-uri-dht-serde
            args: -p agent-uri-dht --all-targets --features serde
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}
      - name: Clippy (${{ matrix.name }})
        run: cargo clippy ${{ matrix.args }} -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --workspace --all-features
      # Nextest does not execute doctests.
      - name: Run doctests
        run: cargo test --doc --workspace --all-features
      # The fuzz targets call the same API as the tests. They are built for real
      # only on the schedule, so without this an API change would break them
      # silently for a week.
      - name: Check fuzz targets compile
        run: cargo clippy --manifest-path agent-uri/fuzz/Cargo.toml --all-targets -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      # Advisories, licenses, duplicate versions, and crate sources.
      # Policy and its documented exceptions live in deny.toml.
      - name: cargo-deny
        run: cargo deny check
      # Second opinion from the RustSec advisory database; its exception list
      # lives in .cargo/audit.toml and mirrors deny.toml.
      - name: cargo-audit
        run: cargo audit

  # A parser of untrusted input that panics is a denial of service in every
  # service that parses one. The proptests in the test job cover this on every
  # commit; this job spends real time on it. It runs on the weekly schedule and
  # on demand rather than per-PR, because a fuzzing run long enough to be worth
  # anything is longer than a PR should wait for.
  fuzz:
    name: fuzz (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_uri
          - parse_trust_root
          - parse_query
          - parse_fragment
          - parse_agent_id
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # cargo-fuzz needs nightly for the sanitizer and coverage flags it passes.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: agent-uri/fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@cargo-fuzz
      # Seeds start the run from inputs that already reach past the scheme, so
      # the budget is spent on the parser rather than on rediscovering "agent://".
      - name: Fuzz ${{ matrix.target }}
        working-directory: agent-uri
        run: |
          cargo fuzz run ${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=300 -rss_limit_mb=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: agent-uri/fuzz/artifacts
