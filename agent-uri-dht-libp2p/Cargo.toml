[package]
name = "agent-uri-dht-libp2p"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Kademlia DHT backend for agent:// discovery, over libp2p-kad"
keywords = ["agent", "dht", "kademlia", "libp2p", "discovery"]
categories = ["network-programming"]

[dependencies]
agent-uri = { version = "0.5.0", path = "../agent-uri" }
agent-uri-attestation = { version = "0.5.0", path = "../agent-uri-attestation" }
agent-uri-dht = { version = "0.7.0", path = "../agent-uri-dht", features = ["serde"] }
async-trait = "0.1.91"
futures = "0.3.33"
libp2p = { version = "0.56.0", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "kad", "identify", "macros"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
