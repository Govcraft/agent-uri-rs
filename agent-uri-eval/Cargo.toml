[package]
name = "agent-uri-eval"
version = "0.3.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Evaluation infrastructure for the Agent Identity URI Scheme paper"
keywords = ["agent", "evaluation", "benchmark", "uri"]
categories = ["development-tools::testing"]

[dependencies]
agent-uri = { version = "0.6", path = "../agent-uri" }
agent-uri-dht = { version = "0.12", path = "../agent-uri-dht" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_chacha = "0.3"
futures = "0.3.33"
agent-uri-attestation = { version = "0.8", path = "../agent-uri-attestation" }

[dev-dependencies]
proptest = "1"
tempfile = "3.24.0"

[lints]
workspace = true

[[example]]
name = "run_expressiveness"
path = "examples/run_expressiveness.rs"

[[example]]
name = "run_discovery"
path = "examples/run_discovery.rs"
